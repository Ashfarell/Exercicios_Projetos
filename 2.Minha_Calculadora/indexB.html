<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projeto calculadora</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- CABEÇALHO -->
    <div class="cabecalho" id="cabecalho">
      <div id="calculadora">
        <h2>Calculadora</h2>
      </div>
      <div id="campoSecundario">
        <p>Versão beta <span>2.1</span></p>
      </div>
    </div>

    <!-- LAYOUT PRINCIPAL + RESULTADO -->
    <div class="layout">
      <!-- PRINCIPAL -->
      <div class="principal" id="principal">
        <div id="regras">
          <h2>Regras:</h2>
        </div>
        <p>1. Preencha o campo valor 1</p>
        <p>2. Preencha o campo operação</p>
        <p>3. Preencha o campo valor 2</p>
        <p>Aperte o botão 'Calcular'</p>

        <!-- CALCULADORA -->
        <div class="calculadora">
          <label for="campo1">Valor 1</label>
          <input type="number" id="campo1" placeholder="Digite o primeiro valor" />

          <div class="operacao">
            <label for="operacao">Operação</label>
            <select id="operacao">
              <option value="">Selecione</option>
              <option value="+">Somar</option>
              <option value="-">Subtrair</option>
              <option value="x">Multiplicar</option>
              <option value="/">Dividir</option>
            </select>
          </div>
          <label for="campo2">Valor 2</label>
          <input type="number" id="campo2" placeholder="Digite o segundo valor" />

          <label for="botaoCalcular">Calcular</label>
          <input type="button" id="botaoCalcular" value="Clique aqui" onmouseover="this.style.color='green'" onmouseout="this.style.color='black'"/>
        </div>
      </div>

      <!-- RESULTADO -->
      <div class="resultado">
        <h3 style="color:red; font-weight: bold; text-align: center;">Resultado:</h3>

         <!-- Área do histórico -->
          <div id="listaResultados">
        <!-- Criamos a div listaResultados p/ poder apagar apenas esses elementos com o botão -->
            
          <h3 style="color: red; font-weight: bold">Histórico de resultados:</h3>
          <!-- <p id="valorResultado"></p> -->
       </div>
    <!-- Botões -->
        <button id="copiarResultado">Copiar resultado</button> 
        <button id="apagarResultado">Apagar resultado</button>
      </div>
    </div>
     </div>

     <!-- TESTE ONCLICK,..... -->
<div id="hora" style="color:red" ></div>
<br/>

     <button onclick="mostrarHora()" onmouseover="this.style.color='green'" onmouseout="this.style.color='black'">Hora</button>
<br/>
<label for="campoTeste"></label>
<input type="text" id="campoTeste"/>

    <script src="script.js"></script>
  </body>
</html>
