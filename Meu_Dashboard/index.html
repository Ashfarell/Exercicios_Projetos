<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Primeiro projeto</title>
    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="cabecalho">
      <h3 id="dashboard">My Dashboard</h3>

      <p>Organize seu dia, acompanhe suas metas.</p>

      <div class="inicio">
        <p>Início</p>
        <p>Tarefas</p>
        <p>Estudos</p>
      </div>
    </div>
    <div class="resumo">
      <div id="tarefasConcluidas">Tarefas concluídas</div>

      <div id="horasEstudo">Horas de estudo</div>
    </div>

    <div class="formulario">
      <p>Adicionar tarefa</p>

      <div class="campo">
        <label for="tarefa">Nome da tarefa</label>
        <input type="text" id="tarefa" />
      </div>

      <div class="grupoSecundario">
        <div class="campo">
          <label for="categoria">Categoria</label>
          <input type="text" id="categoria" />
        </div>

        <div class="campo">
          <label for="prioridade">Prioridade</label>
          <input type="text" id="prioridade" />
        </div>
      </div>

      <br />
      <button id="adicionarTarefa">+ Adicionar tarefa</button>
    </div>

    <label for="submit">Enviar</label>
    <input type="submit" id="submit" />

    <div class="listaTarefas">
      <h3>Lista de tarefas</h3>
      <p>Revisar Javascript</p>
      <p>Praticar Flexbox</p>
    </div>

    <div class="teste">
      <label for="nome">Nome</label>
      <input type="text" id="nome" />

      <label for="idade">Idade</label>
      <input type="number" id="idade" />
    </div>
  </body>
</html>
